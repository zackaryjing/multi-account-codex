[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdx"
dynamic = ["version"]
description = "Switch between saved OpenAI Codex auth profiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zackary Jing" }]
keywords = ["codex", "cli", "auth", "openai", "profiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/zackaryjing/multi-account-codex"
Repository = "https://github.com/zackaryjing/multi-account-codex"

[project.scripts]
mcdx = "mcdx:main"

[tool.setuptools]
py-modules = ["mcdx"]

[tool.setuptools.dynamic]
version = { attr = "mcdx.__version__" }
